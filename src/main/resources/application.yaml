spring:
  application:
    name: spring-boot-agent-agnostic-guardrails
  datasource:
    url: ${DB_URL:jdbc:h2:mem:categoriesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
